stages:
  - test
  - build
  - deploy

image: node:22

variables:
  # ATN's reviewer tool; pinned so a linter update cannot break a release.
  WEBEXT_LINTER_REF: 84f77fdcf92a0abcf768fd8222967a421956d42e
  WEBEXT_LINTER_DIR: /tmp/webext-linter

default:
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.18.0 --activate

test:
  stage: test
  script:
    - pnpm install --frozen-lockfile
    - pnpm test
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

build_thunderbird_extension:
  stage: build
  script:
    - pnpm install --frozen-lockfile
    - pnpm test
    - pnpm run build
    - npx addons-linter builds/*.xpi
    - git clone -q https://github.com/thunderbird/webext-linter "$WEBEXT_LINTER_DIR"
    - git -C "$WEBEXT_LINTER_DIR" checkout -q "$WEBEXT_LINTER_REF"
    - npm --prefix "$WEBEXT_LINTER_DIR" ci --silent
    - node "$WEBEXT_LINTER_DIR/verify.js" builds/*.xpi --warnings-as-errors
    - pnpm run packSrc
  artifacts:
    paths:
      - builds/
      - src_zips/
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_TAG

upload_thunderbird_extension_to_atn:
  stage: deploy
  needs:
    - build_thunderbird_extension
  script:
    - pnpm install --frozen-lockfile
    - node scripts/publish.js --skip-build
  artifacts:
    paths:
      - builds/release-notes.html
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_TAG
  # ATN_API_KEY / ATN_API_SECRET must be set as masked, protected CI/CD
  # variables (Settings > CI/CD > Variables). Release notes cannot be set
  # through ATN's API (it only exposes GET on version resources), so this
  # job uploads and signs the .xpi and leaves the rendered HTML changelog
  # as a job artifact — paste it at the devhub edit_url printed in the log.
