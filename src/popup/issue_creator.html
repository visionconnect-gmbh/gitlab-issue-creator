<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title data-message="localize">
      __MSG_PopupTabsTitle__ - __MSG_ExtensionName__
    </title>
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="editor.css" />
  </head>

  <body>
    <div id="issue-creator-container">
      <h2 data-message="localize"><span>__MSG_PopupTitle__</span></h2>
      <div class="grid">
        <div class="grid-item">
          <div class="section">
            <div class="select-container">
              <label for="projectSearch" data-message="localize">
                __MSG_PopupLabelSelectProject__:
              </label>
              <div class="combobox">
                <input
                  type="text"
                  id="projectSearch"
                  role="combobox"
                  aria-expanded="false"
                  aria-controls="projectSuggestions"
                  aria-autocomplete="list"
                  autocomplete="off"
                  data-i18n-attr="placeholder:PopupPlaceholderSelectProject"
                />
                <ul
                  id="projectSuggestions"
                  class="combobox-listbox"
                  role="listbox"
                  data-i18n-attr="aria-label:PopupComboboxAriaLabel"
                  hidden
                ></ul>
              </div>
              <span
                id="projectSelectedState"
                class="combobox-state"
                aria-live="polite"
                data-message="localize"
                >__MSG_PopupComboboxNoProjectSelected__</span
              >
              <span
                id="projectsStaleNotice"
                class="projects-stale-notice"
                aria-live="polite"
                data-message="localize"
                hidden
                >__MSG_PopupProjectsStale__</span
              >
            </div>
          </div>

          <div class="select-container">
            <label for="issueTitle" data-message="localize">
              __MSG_PopupLabelTitleOfProject__:
            </label>
            <input type="text" id="issueTitle" />
          </div>
        </div>

        <div class="grid-item">
          <div class="section">
            <div class="select-container" style="display: none">
              <label for="assigneeSelect" data-message="localize">
                __MSG_PopupLabelAssigneeSelect__:
              </label>
              <select id="assigneeSelect">
                <option value="" disabled selected data-message="localize">
                  __MSG_PopupAssigneeSelectFirstEntry__
                </option>
              </select>
            </div>

            <div class="select-container date-range">
              <div class="date-field">
                <label for="issueEnd" data-message="localize">
                  __MSG_PopupLabelIssueEnd__:
                </label>
                <input type="date" id="issueEnd" />
              </div>
            </div>

            <div class="select-container picker-triggers">
              <button id="attachmentsButton" data-message="localize">
                <span data-message="localize"
                  >__MSG_PopupLabelAttachmentsButton__</span
                >
              </button>
              <button id="labelsButton" data-message="localize" hidden>
                <span data-message="localize"
                  >__MSG_PopupLabelLabelsButton__</span
                >
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="section">
        <label for="issueDescription" data-message="localize">
          __MSG_PopupLabelIssueDescription__:
        </label>
        <textarea id="issueDescription"></textarea>
      </div>
      <button id="create" data-message="localize" disabled>
        __MSG_PopupButtonSubmit__
      </button>
      <span
        id="createError"
        class="create-error"
        aria-live="polite"
        data-message="localize"
        hidden
        >__MSG_PopupIssueCreateError__</span
      >
    </div>

    <div id="picker-backdrop" hidden>
      <div id="picker-container" role="dialog" aria-modal="true" aria-labelledby="picker-title">
        <div class="picker-header">
          <h2 id="picker-title"></h2>
          <button id="picker-close" aria-label="Close">&times;</button>
        </div>
        <input
          type="search"
          id="picker-search"
          data-i18n-attr="placeholder:PopupPickerSearchPlaceholder"
          autocomplete="off"
        />
        <p id="picker-hint" class="picker-hint" hidden></p>
        <button id="picker-action" hidden></button>
        <div id="picker-list"></div>
      </div>
    </div>
    <script type="module" src="issue_creator.js"></script>
  </body>
</html>
